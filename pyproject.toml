[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[project]
name = "asimov_1_amp"
version = "0.1.0"
description = "Adversarial motion-prior velocity tracking for the Asimov-1 humanoid in Isaac Lab."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Menlo Research" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "isaaclab[isaacsim,rsl-rl]==3.0.0",
    "torch==2.11.0",
]

[project.entry-points."isaaclab.tasks"]
asimov_1_amp = "asimov_1_amp.tasks"

[dependency-groups]
dev = ["pre-commit>=4.2", "pytest>=8.3", "ruff>=0.11"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
isaaclab = { git = "https://github.com/isaac-sim/IsaacLab.git", branch = "release/3.0.0", subdirectory = "tools/wheel_builder" }
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.build-backend]
module-name = "asimov_1_amp"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["asimov_1_amp"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "isaaclab",
    "isaaclab-rl",
    "isaaclab-tasks",
    "isaaclab-assets",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
isaaclab = ["isaaclab", "isaaclab_newton", "isaaclab_ov", "isaaclab_physx"]
"isaaclab-rl" = ["isaaclab_rl"]
"isaaclab-tasks" = ["isaaclab_tasks"]
"isaaclab-assets" = ["isaaclab_assets"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"**/__init__.pyi" = ["F401", "F403"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
